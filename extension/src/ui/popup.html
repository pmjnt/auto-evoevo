<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Auto EvoEvo</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      color-scheme: dark;
      --bg: #0c0d0e;
      --panel: #111315;
      --panel-2: #16191c;
      --field: #0f1113;
      --border: #2a2f35;
      --border-strong: #3b444d;
      --text: #f4f1ea;
      --muted: #9ca6ad;
      --soft: #c9d0d5;
      --accent: #f28c38;
      --accent-2: #ffb067;
      --green: #65d18f;
      --yellow: #f2c94c;
      --red: #ef6461;
    }
    body {
      width: 380px;
      margin: 0;
      padding: 12px;
      overflow-x: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }
    .popup {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
    }
    .topbar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      padding: 12px;
      border-bottom: 1px solid var(--border);
      background: #121518;
    }
    h1, h2, h3, p { margin: 0; }
    h1 { font-size: 16px; line-height: 1.15; }
    .sub { margin-top: 3px; color: var(--muted); font-size: 11px; }
    .status-pill {
      align-self: start;
      min-width: 68px;
      padding: 4px 8px;
      border: 1px solid var(--border-strong);
      border-radius: 7px;
      color: var(--soft);
      font-size: 11px;
      font-weight: 750;
      text-align: center;
      text-transform: lowercase;
    }
    .body { padding: 12px; }
    section { display: none; }
    section.active { display: block; }
    label { display: block; margin-bottom: 4px; color: var(--soft); font-size: 11px; }
    input, select, button { font: inherit; }
    .input, select {
      width: 100%;
      min-width: 0;
      height: 34px;
      padding: 7px 9px;
      border: 1px solid var(--border);
      border-radius: 7px;
      outline: none;
      background: var(--field);
      color: var(--text);
      font: 650 12px/1.2 ui-monospace, SFMono-Regular, Consolas, monospace;
    }
    .input:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(242, 140, 56, .18);
    }
    .btn {
      min-height: 32px;
      padding: 0 10px;
      border: 1px solid var(--border-strong);
      border-radius: 7px;
      background: #1d2226;
      color: var(--text);
      cursor: pointer;
      font-weight: 750;
      font-size: 11px;
      white-space: nowrap;
    }
    .btn.primary {
      border-color: rgba(242, 140, 56, .72);
      background: var(--accent);
      color: #181008;
    }
    .btn:disabled {
      cursor: not-allowed;
      opacity: .52;
    }
    button:focus-visible,
    summary:focus-visible,
    .refresh-link:focus-visible,
    .toggle-row label.tog input:focus-visible + .toggle-track {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .btn:hover:not(:disabled) { border-color: var(--accent); }
    .btn:active:not(:disabled) { transform: translateY(1px); }
    .button-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }
    .button-grid .wide { grid-column: span 2; }
    .address {
      overflow: hidden;
      color: var(--soft);
      font: 720 11px/1.3 ui-monospace, SFMono-Regular, Consolas, monospace;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .metrics {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1px;
      overflow: hidden;
      margin-top: 10px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--border);
    }
    .metric {
      min-width: 0;
      padding: 8px 9px;
      background: var(--panel-2);
    }
    .metric span {
      display: block;
      overflow: hidden;
      color: var(--muted);
      font-size: 10px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .metric strong { display: block; margin-top: 2px; font-size: 15px; line-height: 1.1; }
    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      margin-top: 12px;
      padding: 3px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--field);
    }
    .tab {
      min-height: 28px;
      border: 0;
      border-radius: 5px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 11px;
      font-weight: 760;
    }
    .tab.active {
      background: #242a2f;
      color: var(--text);
    }
    .tab:hover { color: var(--text); }
    .panel {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }
    .panel h2, details > summary {
      color: var(--soft);
      font-size: 11px;
      font-weight: 850;
      text-transform: uppercase;
    }
    .field { margin-top: 8px; }
    .field-label { display: flex; justify-content: space-between; gap: 8px; }
    .hint { color: var(--muted); font-size: 10px; }
    .refresh-link { color: var(--accent-2); text-decoration: none; cursor: pointer; }
    .row { display: flex; justify-content: flex-end; align-items: center; gap: 8px; margin-top: 10px; }
    .row.split { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .msg {
      min-height: 14px;
      margin-top: 8px;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.35;
      white-space: pre-line;
    }
    .msg.err { color: var(--red); }
    .msg.ok { color: var(--green); }
    details {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }
    summary { cursor: pointer; }
    summary:hover { color: var(--text); }
    .toggle-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      margin-top: 8px;
      padding: 8px 0;
      border-top: 1px solid var(--border);
    }
    .toggle-row strong { display: block; font-size: 12px; }
    .toggle-row span { display: block; color: var(--muted); font-size: 10px; }
    .toggle-row label.tog { position: relative; width: 38px; height: 22px; margin: 0; cursor: pointer; }
    .toggle-row label.tog input { position: absolute; inset: 0; width: 38px; height: 22px; margin: 0; opacity: 0; }
    .toggle-track { display: block; width: 38px; height: 22px; border-radius: 999px; background: #343b42; }
    .toggle-track::after {
      content: ""; position: absolute; top: 3px; left: 3px;
      width: 16px; height: 16px; border-radius: 50%;
      background: var(--text); transition: transform .16s ease;
    }
    .toggle-row label.tog input:checked + .toggle-track { background: var(--accent); }
    .toggle-row label.tog input:checked + .toggle-track::after { transform: translateX(16px); }
  </style>
</head>
<body>
  <main class="popup">
    <header class="topbar">
      <div>
        <h1>Auto EvoEvo</h1>
        <p class="sub" id="workflow-subtitle">0G workspace</p>
      </div>
      <div class="status-pill" id="status-text">idle</div>
    </header>

    <div class="body">
      <section id="setup">
        <label for="setupPrivateKey">Private key</label>
        <input id="setupPrivateKey" class="input" type="password" placeholder="0x..." autocomplete="off" />
        <div class="row">
          <button id="saveKey" class="btn primary">Save key</button>
        </div>
        <div id="setup-msg" class="msg"></div>
        <div class="msg">The key is stored as plaintext in this Chrome profile. Use a burner wallet only.</div>
      </section>

      <section id="ready">
        <div class="address" id="address"></div>
        <div class="metrics">
          <div class="metric"><span>Active</span><strong id="active-workflow">none</strong></div>
          <div class="metric"><span>Next run</span><strong id="next-run">-</strong></div>
          <div class="metric"><span>Signed</span><strong id="signed">0</strong></div>
          <div class="metric"><span>Failed</span><strong id="failed">0</strong></div>
        </div>

        <div class="button-grid">
          <button id="runFeed" class="btn">Run Feed</button>
          <button id="runPredictions" class="btn">Run Predictions</button>
          <button id="runBoth" class="btn primary wide">Run Both</button>
          <button id="pause" class="btn wide">Pause</button>
        </div>
        <div id="start-msg" class="msg"></div>
        <div id="event-log" class="msg" style="max-height:60px;overflow-y:auto"></div>

        <div class="tabs" role="tablist" aria-label="Workflow view">
          <button id="tabFeed" class="tab active" role="tab" aria-selected="true">Feed</button>
          <button id="tabPredictions" class="tab" role="tab" aria-selected="false">Predictions</button>
        </div>

        <section id="feed-panel" class="panel active" role="tabpanel">
          <h2>Feed</h2>
          <div class="metrics">
            <div class="metric"><span>Owned agents</span><strong id="owned-agents">0</strong></div>
            <div class="metric"><span>Completed</span><strong id="feed-completed">0</strong></div>
          </div>
        </section>

        <section id="predictions-panel" class="panel" role="tabpanel">
          <h2>Predictions</h2>
          <div class="field">
            <div class="field-label">
              <label for="agentId">Target agent</label>
              <span class="hint"><a class="refresh-link" id="loadAgents">Refresh</a></span>
            </div>
            <select id="agentId">
              <option value="0">Refresh to load</option>
            </select>
          </div>
          <div class="metrics">
            <div class="metric"><span>Sources</span><strong id="source-agents">0</strong></div>
            <div class="metric"><span>Scanned</span><strong id="predictions-scanned">0</strong></div>
            <div class="metric"><span>Added</span><strong id="predictions-added">0</strong></div>
            <div class="metric"><span>Skipped</span><strong id="predictions-skipped">0</strong></div>
          </div>
        </section>

        <details>
          <summary>Advanced</summary>
          <div class="field">
            <label for="rpcUrl">0G RPC URL</label>
            <input id="rpcUrl" class="input" placeholder="https://evmrpc.0g.ai" />
          </div>
          <div class="row split">
            <div class="field">
              <label for="chainId">Chain ID</label>
              <input id="chainId" class="input" type="number" />
            </div>
            <div class="field">
              <label for="maxFeeNative">Max fee (OG)</label>
              <input id="maxFeeNative" class="input" type="text" placeholder="0.01" />
            </div>
          </div>
          <div class="row split">
            <div class="field">
              <label for="repeatIntervalMinutes">Repeat (min)</label>
              <input id="repeatIntervalMinutes" class="input" type="number" min="30" max="1440" />
            </div>
            <div class="field">
              <label for="reconciliationIntervalMinutes">Full scan (min)</label>
              <input id="reconciliationIntervalMinutes" class="input" type="number" min="30" max="1440" />
            </div>
          </div>
          <div class="field">
            <label for="gasPriceJitterPercent">Gas jitter (%)</label>
            <input id="gasPriceJitterPercent" class="input" type="number" min="0" max="100" step="1" />
          </div>
          <div class="field">
            <label for="allowedContracts">Allowed contracts</label>
            <input id="allowedContracts" class="input" />
          </div>
          <div class="field">
            <label for="allowedFunctionSelectors">Allowed selectors</label>
            <input id="allowedFunctionSelectors" class="input" />
          </div>
          <div class="toggle-row">
            <span>
              <strong>Dry-run mode</strong>
              <span>Preview without signing</span>
            </span>
            <label class="tog">
              <input type="checkbox" id="dryRun" checked />
              <span class="toggle-track"></span>
            </label>
          </div>
          <div class="row split">
            <div class="field">
              <label for="cooldownSeconds">Cooldown (s)</label>
              <input id="cooldownSeconds" class="input" type="number" min="0" max="300" />
            </div>
            <div class="field">
              <label for="stopAtRemaining">Stop at remaining</label>
              <input id="stopAtRemaining" class="input" type="number" min="0" max="1000" />
            </div>
          </div>
          <div class="row split">
            <div class="field">
              <label for="memoryApiCooldownSeconds">Memory API cooldown (s)</label>
              <input id="memoryApiCooldownSeconds" class="input" type="number" min="0" max="60" />
            </div>
            <div class="field">
              <label for="predictionReadCooldownSeconds">Prediction read cooldown (s)</label>
              <input id="predictionReadCooldownSeconds" class="input" type="number" min="0" max="60" />
            </div>
          </div>
          <div class="row split">
            <div class="field">
              <label for="rateLimitBackoffMinutes">Rate limit backoff (m)</label>
              <input id="rateLimitBackoffMinutes" class="input" type="number" min="1" max="1440" />
            </div>
          </div>
          <div class="field">
            <label>Wallet address</label>
            <input id="walletAddress" class="input" type="text" readonly />
          </div>
          <div class="row">
            <button id="clearKey" class="btn">Remove key</button>
            <button id="save" class="btn primary">Save settings</button>
          </div>
          <div id="save-msg" class="msg"></div>
        </details>
      </section>
    </div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
