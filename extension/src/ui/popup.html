<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Auto EvoEvo</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      color-scheme: dark;
      --bg: #0b0b0a;
      --field: #0f0d0a;
      --border: #352a1f;
      --border-soft: rgba(255, 126, 31, .20);
      --text: #fff7ed;
      --muted: #b9a895;
      --soft: #ead7c2;
      --orange: #ff7a1a;
      --orange-2: #ffad32;
      --green: #65d18f;
      --yellow: #ffd166;
      --red: #ff6b6b;
    }
    body {
      width: 360px;
      margin: 0;
      padding: 14px;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 0% 0%, rgba(255, 122, 26, .14), transparent 36%),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .popup {
      overflow: hidden;
      border: 1px solid rgba(255, 126, 31, .28);
      border-radius: 8px;
      background: linear-gradient(180deg, rgba(24, 19, 14, .98), rgba(13, 11, 9, .98));
      box-shadow: 0 24px 70px rgba(0, 0, 0, .42);
    }
    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      border-bottom: 1px solid var(--border-soft);
      background: linear-gradient(90deg, rgba(255, 122, 26, .13), rgba(255, 173, 50, .06), transparent);
    }
    .logo {
      display: grid;
      width: 40px;
      height: 40px;
      place-items: center;
      flex: 0 0 auto;
      border: 1px solid rgba(255, 126, 31, .20);
      border-radius: 8px;
      background: #15120f;
      box-shadow: 0 10px 22px rgba(255, 122, 26, .13);
    }
    .logo svg {
      width: 33px;
      height: 19px;
      display: block;
    }
    h1, p { margin: 0; }
    h1 { font-size: 15px; line-height: 1.1; letter-spacing: 0; }
    .sub { margin-top: 3px; color: var(--muted); font-size: 12px; }
    .badge {
      margin-left: auto;
      padding: 4px 8px;
      border: 1px solid rgba(255, 126, 31, .45);
      border-radius: 999px;
      background: rgba(255, 126, 31, .10);
      color: #ffb06a;
      font-size: 11px;
      font-weight: 850;
      white-space: nowrap;
    }
    .body { padding: 14px; }
    label { display: block; margin-bottom: 6px; color: var(--soft); font-size: 12px; }
    input, button { font: inherit; }
    .input {
      width: 100%;
      min-width: 0;
      height: 38px;
      padding: 9px 11px;
      border: 1px solid var(--border);
      border-radius: 7px;
      outline: none;
      background: var(--field);
      color: var(--text);
    }
    .input:focus {
      border-color: var(--orange);
      box-shadow: 0 0 0 3px rgba(255, 122, 26, .14);
    }
    .btn {
      min-height: 36px;
      padding: 0 14px;
      border: 0;
      border-radius: 7px;
      background: linear-gradient(135deg, var(--orange), var(--orange-2));
      color: #160b04;
      cursor: pointer;
      font-weight: 850;
      white-space: nowrap;
      box-shadow: 0 10px 22px rgba(255, 122, 26, .22);
    }
    .btn.ghost {
      border: 1px solid #5a4330;
      background: transparent;
      color: var(--soft);
      box-shadow: none;
    }
    .row { display: flex; justify-content: flex-end; align-items: center; gap: 8px; margin-top: 12px; }
    .stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-top: 12px;
    }
    .address {
      overflow: hidden;
      color: var(--soft);
      font: 750 12px/1.3 ui-monospace, SFMono-Regular, Consolas, monospace;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .stat {
      min-width: 0;
      padding: 10px;
      border: 1px solid rgba(255, 126, 31, .18);
      border-radius: 7px;
      background: rgba(13, 11, 9, .72);
    }
    .stat span {
      display: block;
      overflow: hidden;
      color: var(--muted);
      font-size: 11px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .stat strong {
      display: block;
      margin-top: 2px;
      font-size: 18px;
      line-height: 1.1;
    }
    #status-text { color: var(--green); }
    #unlock-error, #start-msg {
      min-height: 16px;
      margin-top: 10px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
    }
    #unlock-error { color: var(--red); }
    section { display: none; }
    section.active { display: block; }
  </style>
</head>
<body>
  <main class="popup">
    <header class="topbar">
      <div class="logo">
        <svg viewBox="0 0 88 34" aria-hidden="true">
          <path d="M4 20C13 6 24 6 44 20C64 34 75 34 84 20" fill="none" stroke="#ff7a1a" stroke-width="5.2" stroke-linecap="round" />
          <path d="M4 20C13 34 24 34 44 20C64 6 75 6 84 20" fill="none" stroke="#ff7a1a" stroke-width="5.2" stroke-linecap="round" />
          <path d="M8 19C17 10 26 10 42 20" fill="none" stroke="#ffad32" stroke-width="2" stroke-linecap="round" opacity=".75" />
        </svg>
      </div>
      <div>
        <h1>Auto EvoEvo</h1>
        <p class="sub">Guarded 0G signer</p>
      </div>
      <div class="badge">0G</div>
    </header>

    <div class="body">
      <section id="locked" class="active">
        <label for="password">Master password</label>
        <input id="password" class="input" type="password" autocomplete="current-password" />
        <div class="row">
          <button id="unlock" class="btn">Unlock</button>
        </div>
        <div id="unlock-error"></div>
      </section>

      <section id="unlocked">
        <div class="address" id="address"></div>
        <div class="stats">
          <div class="stat"><span>Status</span><strong id="status-text">idle</strong></div>
          <div class="stat"><span>Signed</span><strong id="signed">0</strong></div>
          <div class="stat"><span>Dry-run</span><strong id="dry">0</strong></div>
          <div class="stat"><span>Manual</span><strong id="manual">0</strong></div>
          <div class="stat"><span>Rejected</span><strong id="rejected">0</strong></div>
        </div>
        <div class="row">
          <button id="lock" class="btn ghost">Lock</button>
          <button id="pause" class="btn ghost">Pause</button>
          <button id="start" class="btn">Start</button>
        </div>
        <div id="start-msg"></div>
      </section>
    </div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
