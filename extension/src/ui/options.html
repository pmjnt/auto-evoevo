<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Auto EvoEvo — Options</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 460px; margin: 0 auto; padding: 24px; background: #0f1115; color: #e6e9ef; }
    label { display: block; font-size: 12px; color: #8a93a6; margin: 12px 0 4px; }
    input { width: 100%; padding: 8px 10px; background: #0e1219; border: 1px solid #2a3142; color: #e6e9ef; border-radius: 6px; }
    button { margin-top: 16px; padding: 8px 12px; border-radius: 6px; background: #7aa2f7; color: #0b0e14; font-weight: 600; border: none; cursor: pointer; }
    .row { display: flex; gap: 8px; }
    .row > div { flex: 1; }
    #msg { margin-top: 12px; font-size: 12px; }
  </style>
</head>
<body>
  <h1>Options</h1>

  <label>0G RPC URL</label>
  <input id="rpcUrl" />

  <div class="row">
    <div><label>Chain id</label><input id="chainId" /></div>
    <div><label>Max fee (OG)</label><input id="maxFeeNative" /></div>
  </div>

  <label>Allowed contracts (comma-separated)</label>
  <input id="allowedContracts" />

  <label>Allowed function selectors (comma-separated)</label>
  <input id="allowedFunctionSelectors" />

  <label>Idle-lock minutes</label>
  <input id="idleLockMinutes" />

  <label>Cooldown giữa mỗi tx (giây, 0 = không chờ)</label>
  <input id="cooldownSeconds" type="number" min="0" max="300" value="3" />

  <label>
    <input type="checkbox" id="dryRun" checked />
    Dry-run mode (do not actually sign transactions)
  </label>

  <label>Private key (one-time import; cleared on save)</label>
  <input id="privateKey" type="password" />

  <label>Master password (for the new vault)</label>
  <input id="password" type="password" />

  <button id="save">Save</button>
  <div id="msg"></div>
  <script src="options.js"></script>
</body>
</html>
