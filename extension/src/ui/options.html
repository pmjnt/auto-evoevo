<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Auto EvoEvo Options</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      color-scheme: dark;
      --bg: #0b0b0a;
      --field: #0f0d0a;
      --border: #352a1f;
      --border-soft: rgba(255, 126, 31, .20);
      --text: #fff7ed;
      --muted: #b9a895;
      --soft: #ead7c2;
      --orange: #ff7a1a;
      --orange-2: #ffad32;
      --green: #65d18f;
      --red: #ff6b6b;
    }
    body {
      min-width: 560px;
      margin: 0;
      padding: 26px;
      background:
        radial-gradient(circle at 14% 0%, rgba(255, 122, 26, .16), transparent 25%),
        radial-gradient(circle at 88% 8%, rgba(255, 173, 50, .10), transparent 28%),
        linear-gradient(180deg, #12100d, var(--bg));
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .shell {
      width: min(100%, 720px);
      margin: 0 auto;
      overflow: hidden;
      border: 1px solid rgba(255, 126, 31, .28);
      border-radius: 8px;
      background: linear-gradient(180deg, rgba(24, 19, 14, .98), rgba(13, 11, 9, .98));
      box-shadow: 0 24px 70px rgba(0, 0, 0, .42);
    }
    .topbar {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 20px 22px 16px;
      border-bottom: 1px solid var(--border-soft);
      background: linear-gradient(90deg, rgba(255, 122, 26, .13), rgba(255, 173, 50, .06), transparent);
    }
    .logo {
      display: grid;
      width: 46px;
      height: 46px;
      place-items: center;
      flex: 0 0 auto;
      border: 1px solid rgba(255, 126, 31, .20);
      border-radius: 8px;
      background: #15120f;
      box-shadow: 0 12px 26px rgba(255, 122, 26, .14);
    }
    .logo svg {
      display: block;
      width: 38px;
      height: 22px;
    }
    h1, h2, p { margin: 0; }
    h1 { font-size: 22px; line-height: 1.12; letter-spacing: 0; }
    .sub { margin-top: 4px; color: var(--muted); font-size: 13px; }
    .badge {
      margin-left: auto;
      padding: 6px 10px;
      border: 1px solid rgba(255, 126, 31, .45);
      border-radius: 999px;
      background: rgba(255, 126, 31, .10);
      color: #ffb06a;
      font-size: 12px;
      font-weight: 850;
      white-space: nowrap;
    }
    .form {
      display: grid;
      gap: 16px;
      padding: 18px 22px 22px;
    }
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }
    .section h2 {
      color: var(--text);
      font-size: 13px;
      letter-spacing: .02em;
    }
    .section-note {
      color: #9b8066;
      font-size: 11px;
      white-space: nowrap;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .field { min-width: 0; }
    .field-label {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 6px;
      color: var(--soft);
      font-size: 12px;
    }
    .hint { color: #9b8066; font-size: 11px; white-space: nowrap; }
    input {
      display: block;
      width: 100%;
      min-width: 0;
      height: 38px;
      padding: 9px 11px;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 7px;
      outline: none;
      background: var(--field);
      color: var(--text);
      font: 650 13px/1.2 ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      text-overflow: ellipsis;
    }
    input:focus {
      border-color: var(--orange);
      box-shadow: 0 0 0 3px rgba(255, 122, 26, .14);
    }
    .switch {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px;
      border: 1px solid var(--border-soft);
      border-radius: 8px;
      background: rgba(13, 11, 9, .72);
      cursor: pointer;
    }
    .switch strong { display: block; margin-bottom: 3px; font-size: 13px; }
    .switch span { display: block; color: var(--muted); font-size: 12px; }
    .toggle {
      position: relative;
      flex: 0 0 auto;
      width: 44px;
      height: 24px;
    }
    .toggle input {
      position: absolute;
      inset: 0;
      width: 44px;
      height: 24px;
      margin: 0;
      opacity: 0;
    }
    .toggle-track {
      display: block;
      width: 44px;
      height: 24px;
      border-radius: 999px;
      background: #3b2a1d;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .08);
      transition: background .16s ease;
    }
    .toggle-track::after {
      content: "";
      position: absolute;
      top: 4px;
      left: 4px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fff7ed;
      transition: transform .16s ease;
    }
    .toggle input:checked + .toggle-track {
      background: linear-gradient(135deg, var(--orange), var(--orange-2));
    }
    .toggle input:checked + .toggle-track::after {
      transform: translateX(20px);
    }
    .actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-top: 2px;
    }
    .note {
      min-width: 0;
      color: var(--muted);
      font-size: 12px;
    }
    button {
      min-height: 36px;
      padding: 0 15px;
      border: 0;
      border-radius: 7px;
      background: linear-gradient(135deg, var(--orange), var(--orange-2));
      color: #160b04;
      cursor: pointer;
      font-weight: 850;
      white-space: nowrap;
      box-shadow: 0 10px 22px rgba(255, 122, 26, .22);
    }
    #msg {
      min-height: 16px;
      margin-top: 2px;
      color: var(--green);
      font-size: 12px;
    }
    @media (max-width: 620px) {
      body { min-width: 0; padding: 14px; }
      .row { grid-template-columns: 1fr; }
      .badge { display: none; }
      .actions { align-items: stretch; flex-direction: column; }
      button { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="logo">
        <svg viewBox="0 0 88 34" aria-hidden="true">
          <path d="M4 20C13 6 24 6 44 20C64 34 75 34 84 20" fill="none" stroke="#ff7a1a" stroke-width="5.2" stroke-linecap="round" />
          <path d="M4 20C13 34 24 34 44 20C64 6 75 6 84 20" fill="none" stroke="#ff7a1a" stroke-width="5.2" stroke-linecap="round" />
          <path d="M8 19C17 10 26 10 42 20" fill="none" stroke="#ffad32" stroke-width="2" stroke-linecap="round" opacity=".75" />
        </svg>
      </div>
      <div>
        <h1>Auto EvoEvo</h1>
        <p class="sub">Guarded 0G automation console</p>
      </div>
      <div class="badge">Dry-run ready</div>
    </header>

    <section class="form">
      <section class="section">
        <div class="section-head">
          <h2>Network</h2>
          <span class="section-note">0G mainnet</span>
        </div>
        <div class="row">
          <div class="field">
            <label class="field-label" for="rpcUrl"><span>0G RPC URL</span><span class="hint">required</span></label>
            <input id="rpcUrl" placeholder="https://evmrpc.0g.ai" />
          </div>
          <div class="field">
            <label class="field-label" for="chainId"><span>Chain id</span></label>
            <input id="chainId" placeholder="16661" />
          </div>
        </div>
      </section>

      <section class="section">
        <div class="section-head">
          <h2>Transaction Guardrails</h2>
          <span class="section-note">sign only what matches</span>
        </div>
        <div class="row">
          <div class="field">
            <label class="field-label" for="maxFeeNative"><span>Max fee (OG)</span></label>
            <input id="maxFeeNative" placeholder="0.001" />
          </div>
          <div class="field">
            <label class="field-label" for="cooldownSeconds"><span>Cooldown seconds</span><span class="hint">0-300</span></label>
            <input id="cooldownSeconds" type="number" min="0" max="300" value="3" />
          </div>
        </div>
        <div style="height:10px"></div>
        <div class="field">
          <label class="field-label" for="allowedContracts"><span>Allowed contracts</span><span class="hint">comma-separated</span></label>
          <input id="allowedContracts" />
        </div>
        <div style="height:10px"></div>
        <div class="field">
          <label class="field-label" for="allowedFunctionSelectors"><span>Allowed function selectors</span><span class="hint">4 bytes</span></label>
          <input id="allowedFunctionSelectors" />
        </div>
      </section>

      <label class="switch" for="dryRun">
        <span>
          <strong>Dry-run mode</strong>
          <span>Preview every flow without signing transactions.</span>
        </span>
        <span class="toggle">
          <input type="checkbox" id="dryRun" checked />
          <span class="toggle-track"></span>
        </span>
      </label>

      <section class="section">
        <div class="section-head">
          <h2>Vault</h2>
          <span class="section-note">encrypted locally</span>
        </div>
        <div class="row">
          <div class="field">
            <label class="field-label" for="privateKey"><span>Private key</span><span class="hint">cleared on save</span></label>
            <input id="privateKey" type="password" />
          </div>
          <div class="field">
            <label class="field-label" for="password"><span>Master password</span></label>
            <input id="password" type="password" />
          </div>
        </div>
      </section>

      <div class="actions">
        <div>
          <div class="note">Key is stored encrypted in chrome.storage.local.</div>
          <div id="msg"></div>
        </div>
        <button id="save">Save configuration</button>
      </div>
    </section>
  </main>
  <script src="options.js"></script>
</body>
</html>
